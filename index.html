<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sustentabilidade, Saúde, Segurança e Qualidade de Vida no Trabalho — Guia de Estudos</title>
<meta name="description" content="Guia de estudos interativo sobre sustentabilidade e responsabilidade socioambiental, promoção da saúde, qualidade de vida no trabalho, endomarketing, legislação de SST, riscos ocupacionais, SESMT, CIPA e CAT.">
<style>
  :root{
    --bg:#eef1f3; --surface:#ffffff; --surface-2:#f4f6f7; --surface-3:#e7ebed;
    --ink:#1b2326; --ink-dim:#5c6b70; --rule:#d7dee1;
    --accent:#0f6e8c; --accent-soft:#dff0f5;
    --good:#2f9e5c; --warn:#c2871f; --bad:#c23b3b;
    --cat-1:#0f6e8c; --cat-2:#2f9e5c; --cat-3:#c2871f; --cat-4:#6a4fa0; --cat-5:#c23b7a;
    --bar-h:56px;
    --font-display: -apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    --font-body: Georgia,"Iowan Old Style","Sitka Text","Noto Serif",serif;
    --font-mono: ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Roboto Mono",monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10161a; --surface:#161d22; --surface-2:#1c242a; --surface-3:#232c33;
      --ink:#e7eef1; --ink-dim:#93a3aa; --rule:#2a343b;
      --accent:#5fd0f2; --accent-soft:#163440;
      --good:#5fc98a; --warn:#dba43f; --bad:#e2685f;
      --cat-1:#5fd0f2; --cat-2:#5fc98a; --cat-3:#dba43f; --cat-4:#a98ce0; --cat-5:#e287b0;
    }
  }
  :root[data-theme="dark"]{
    --bg:#10161a; --surface:#161d22; --surface-2:#1c242a; --surface-3:#232c33;
    --ink:#e7eef1; --ink-dim:#93a3aa; --rule:#2a343b;
    --accent:#5fd0f2; --accent-soft:#163440;
    --good:#5fc98a; --warn:#dba43f; --bad:#e2685f;
    --cat-1:#5fd0f2; --cat-2:#5fc98a; --cat-3:#dba43f; --cat-4:#a98ce0; --cat-5:#e287b0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.55; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:var(--font-display); font-weight:800; letter-spacing:-.01em; text-wrap:balance; margin:0; color:var(--ink);}
  p{margin:0 0 .75em 0;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  .eyebrow{font-family:var(--font-mono); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--accent);}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--rule); border-radius:6px;}

  /* ============ APP SHELL ============ */
  .deck{display:flex; height:100vh; height:100dvh; background:var(--bg);}
  .rail{
    width:272px; flex:none; background:var(--surface); border-right:1px solid var(--rule);
    display:flex; flex-direction:column; transition:margin-left .2s; overflow:hidden;
  }
  .rail-scroll{flex:1; overflow-y:auto; padding:18px 12px 18px; min-height:0;}
  .rail-brand{padding:4px 10px 16px;}
  .rail-brand h1{font-size:1rem; line-height:1.3;}
  .rail-mod{margin-bottom:4px;}
  .rail-mod-head{
    display:flex; align-items:center; gap:8px; padding:9px 10px;
    font-size:.76rem; font-weight:700; color:var(--ink-dim); letter-spacing:.02em; font-family:var(--font-display);
    cursor:pointer; border-radius:6px;
  }
  .rail-mod-head:hover{background:var(--surface-2);}
  .rail-mod-head .num{font-family:var(--font-mono); color:var(--accent); font-size:.72rem;}
  .rail-slides{padding-left:6px; border-left:1px solid var(--rule); margin:2px 0 10px 18px;}
  .rail-item{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    background:none; border:none; padding:6px 10px; font-size:.8rem; color:var(--ink-dim); font-family:var(--font-body);
    cursor:pointer; border-radius:6px; line-height:1.3;
  }
  .rail-item:hover{background:var(--surface-2); color:var(--ink);}
  .rail-item.current{background:var(--accent-soft); color:var(--accent); font-weight:700;}
  .rail-item .dot{width:5px; height:5px; border-radius:50%; background:var(--rule); flex:none;}
  .rail-item.visited .dot{background:var(--good);}
  .rail-footer{
    flex:none; background:var(--surface); padding:0 14px; border-top:1px solid var(--rule);
    font-size:.7rem; color:var(--ink-dim); height:var(--bar-h); box-sizing:border-box;
    display:flex; align-items:center; overflow:hidden;
  }
  .rail-footer a{color:var(--accent); text-decoration:none; font-weight:700;}
  .rail-footer a:hover{text-decoration:underline;}

  .main{flex:1; display:flex; flex-direction:column; min-width:0;}
  .navbar{
    display:flex; align-items:center; gap:12px; padding:0 18px;
    border-top:1px solid var(--rule); background:var(--surface); flex:none;
    height:var(--bar-h); box-sizing:border-box; overflow-x:auto;
  }
  .navbar .crumb{font-size:.8rem; color:var(--ink-dim); white-space:nowrap;}
  .navbar .crumb strong{color:var(--ink);}
  .progress-track{flex:1; height:5px; background:var(--surface-3); border-radius:4px; overflow:hidden; min-width:80px;}
  .progress-fill{height:100%; background:var(--accent); width:0%; transition:width .2s;}
  .navbar .count{font-family:var(--font-mono); font-size:.76rem; color:var(--ink-dim); white-space:nowrap;}
  .navbar .score{font-family:var(--font-mono); font-size:.76rem; color:var(--good); white-space:nowrap;}
  .navbar .nav-arrows{display:flex; align-items:center; gap:8px; flex:none;}
  .corner-controls{position:fixed; top:16px; right:16px; z-index:20; display:flex; gap:8px;}
  .iconbtn{
    background:var(--surface-2); border:1px solid var(--rule); border-radius:7px;
    width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink); flex:none; font-size:1rem;
  }
  .iconbtn:hover{border-color:var(--accent); color:var(--accent);}
  .iconbtn[disabled]{opacity:.35; pointer-events:none;}

  .stage-wrap{flex:1; overflow-y:auto; position:relative; display:flex; justify-content:center;}
  .stage{width:100%; max-width:860px; padding:44px clamp(20px,4vw,48px) 72px;}
  .slide{animation:slideIn .22s ease;}
  @keyframes slideIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .slide-kicker{display:block; margin-bottom:8px;}
  .slide h2{font-size:clamp(1.5rem,3.4vw,2.15rem); margin-bottom:14px;}
  .slide .lede{font-size:1.02rem; color:var(--ink-dim); max-width:62ch; margin-bottom:22px;}
  .block{margin-bottom:26px;}
  .block h3{font-size:1.05rem; margin-bottom:10px; font-family:var(--font-display);}
  .block h4{font-size:.92rem; margin-bottom:6px;}

  /* ---- welcome ---- */
  .welcome{max-width:600px; margin:30px auto; text-align:center;}
  .welcome .eyebrow{display:block; margin-bottom:16px;}
  .welcome h2{font-size:clamp(1.8rem,4vw,2.5rem); margin-bottom:18px;}
  .welcome p{font-size:1.02rem; color:var(--ink-dim); margin-bottom:14px;}
  .welcome p.sign{color:var(--ink); font-style:italic; margin-top:24px; line-height:1.7;}
  .welcome a{color:var(--accent); text-decoration:none; font-weight:700;}
  .welcome a:hover{text-decoration:underline;}
  .welcome .btn{margin-top:10px;}

  /* ============ IMMERSIVE ============ */
  .deck.immersive .rail{margin-left:-272px; width:0; padding:0; border:none; overflow:hidden;}
  .deck.immersive .rail.open{margin-left:0; width:272px; border-right:1px solid var(--rule); overflow:hidden; z-index:12;}
  .deck.immersive .navbar{position:absolute; bottom:0; left:0; right:0; z-index:4; background:color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter:blur(6px);}
  .deck.immersive .stage{max-width:960px;}

  @media (max-width:860px){
    .rail{position:fixed; z-index:10; height:100%; margin-left:-272px;}
    .rail.open{margin-left:0; box-shadow:0 0 30px rgba(0,0,0,.25);}
    .navbar .crumb{display:none;}
  }

  /* ============ GENERIC COMPONENTS ============ */
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  .grid-5{display:grid; grid-template-columns:repeat(5,1fr); gap:12px;}
  @media (max-width:700px){ .grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:1fr;} }

  .card{background:var(--surface-2); border:1px solid var(--rule); border-top:3px solid var(--cat-1); border-radius:10px; padding:16px 18px;}
  .card:nth-child(5n+1){border-top-color:var(--cat-1);}
  .card:nth-child(5n+2){border-top-color:var(--cat-2);}
  .card:nth-child(5n+3){border-top-color:var(--cat-3);}
  .card:nth-child(5n+4){border-top-color:var(--cat-4);}
  .card:nth-child(5n+5){border-top-color:var(--cat-5);}
  .card h4{font-size:.92rem; font-family:var(--font-display);}
  .card p{font-size:.88rem; color:var(--ink-dim); margin-bottom:0;}
  .formula{font-family:var(--font-mono); font-size:.85rem; background:var(--surface-3); border-radius:6px; padding:5px 9px; display:inline-block; margin:6px 0;}
  .card .note{font-size:.8rem; color:var(--ink-dim); margin-top:6px;}
  .tag{display:inline-block; font-size:.62rem; letter-spacing:.06em; text-transform:uppercase; padding:2px 8px; border-radius:10px;}
  .tag.good{background:color-mix(in srgb, var(--good) 18%, transparent); color:var(--good);}
  .tag.warn{background:color-mix(in srgb, var(--warn) 18%, transparent); color:var(--warn);}
  .tag.bad{background:color-mix(in srgb, var(--bad) 18%, transparent); color:var(--bad);}

  .example{
    border-left:3px solid var(--accent); background:var(--surface-2);
    padding:10px 14px; border-radius:0 8px 8px 0; font-size:.86rem; margin-top:10px;
  }
  .example .eyebrow{display:block; margin-bottom:4px;}

  /* ---- radial diagram ---- */
  .interfaces-wrap{display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap;}
  .radial{position:relative; width:280px; height:280px; flex:none; margin:0 auto;}
  .radial-spokes{position:absolute; inset:0; pointer-events:none; width:100%; height:100%;}
  .radial .hub{
    position:absolute; top:50%; left:50%; width:102px; height:102px; margin:-51px 0 0 -51px;
    border-radius:50%; background:var(--accent-soft); border:2px solid var(--accent);
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-family:var(--font-display); font-weight:800; font-size:.74rem; line-height:1.15; padding:6px;
    box-shadow:0 0 0 6px var(--surface);
  }
  .radial .node{
    position:absolute; width:80px; height:80px; margin:-40px 0 0 -40px; border-radius:50%;
    background:var(--surface-2); border:2px dashed var(--rule);
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:.7rem; font-weight:600; cursor:pointer; padding:4px;
    transition:border-color .15s, background .15s, transform .15s, box-shadow .15s;
  }
  .radial .node:hover{transform:scale(1.07);}
  .radial .node.visited{border-style:solid;}
  .radial .node.sel{transform:scale(1.1); box-shadow:0 6px 16px rgba(0,0,0,.14); z-index:2;}
  .radial .node .check{
    position:absolute; top:-6px; right:-2px; width:20px; height:20px; border-radius:50%;
    color:#fff; font-size:.6rem; display:flex; align-items:center; justify-content:center;
    opacity:0; transform:scale(.4); transition:opacity .15s, transform .15s;
  }
  .radial .node.visited .check{opacity:1; transform:scale(1);}
  .interfaces-desc{flex:1; min-width:220px; background:var(--surface-2); border:1px solid var(--rule); border-radius:10px; padding:16px 18px; min-height:110px;}
  .interfaces-progress{font-family:var(--font-mono); font-size:.68rem; color:var(--ink-dim); margin-top:10px; letter-spacing:.04em;}

  /* ---- numbered steps ---- */
  .steps{counter-reset:step; display:flex; flex-direction:column; gap:14px;}
  .step{display:grid; grid-template-columns:34px 1fr; gap:12px;}
  .step .sn{
    counter-increment:step; width:34px; height:34px; border-radius:50%;
    background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent);
    display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:.82rem;
  }
  .step .sn::before{content:counter(step);}
  .step .st h4{font-size:.9rem; margin-bottom:3px; font-family:var(--font-display);}
  .step .st p{font-size:.85rem; color:var(--ink-dim); margin-bottom:0;}

  /* ---- bar chart ---- */
  .bars{display:flex; flex-direction:column; gap:7px;}
  .bar-row{display:grid; grid-template-columns:170px 1fr 86px; gap:10px; align-items:center; font-size:.82rem;}
  .bar-row .lbl{color:var(--ink-dim);}
  .bar-row.total .lbl{color:var(--ink); font-weight:700;}
  .bar-track{height:16px; background:var(--surface-3); border-radius:4px; overflow:hidden; position:relative;}
  .bar-fill{height:100%; border-radius:4px;}
  .bar-fill.total{background:var(--accent);}
  .bar-fill.pos{background:var(--good);}
  .bar-fill.neg{background:var(--bad);}
  .bar-row .val{font-family:var(--font-mono); text-align:right;}

  /* ---- stacked pair ---- */
  .stack-pair{display:flex; gap:28px; align-items:flex-end; justify-content:center; flex-wrap:wrap;}
  .stack-col{display:flex; flex-direction:column; align-items:center; gap:8px;}
  .stack-bar{width:150px; height:260px; border-radius:8px; overflow:hidden; display:flex; flex-direction:column; border:1px solid var(--rule);}
  .stack-seg{display:flex; align-items:center; justify-content:center; text-align:center; font-size:.68rem; padding:4px; color:#fff;}
  .stack-col .cap{font-size:.78rem; font-weight:700; color:var(--ink-dim); font-family:var(--font-display);}
  .dbl-eq{font-family:var(--font-mono); font-size:1.6rem; color:var(--accent); flex:none;}

  /* ---- sequential flow ---- */
  .seq-flow{display:flex; align-items:stretch; gap:10px; flex-wrap:wrap;}
  .seq-box{
    background:var(--surface-2); border:1px solid var(--rule); border-left:4px solid var(--accent);
    border-radius:8px; padding:10px 14px; font-size:.78rem; font-weight:600; text-align:center;
    flex:1 1 150px; min-width:150px; max-width:220px; line-height:1.35;
    overflow-wrap:break-word; word-break:break-word; hyphens:auto;
    display:flex; align-items:center; justify-content:center;
  }
  .seq-arrow{color:var(--ink-dim); font-size:1.1rem; flex:none; display:flex; align-items:center;}

  /* ---- tree ---- */
  .tree{font-size:.86rem;}
  .tree-node{border-left:2px solid var(--rule); margin-left:10px; padding-left:16px; margin-top:6px;}
  .tree-node.l0{border-left:none; margin-left:0; padding-left:0;}
  .tree-label{background:var(--surface-2); border:1px solid var(--rule); border-radius:7px; padding:6px 11px; display:inline-block; margin-bottom:2px;}
  .tree-label.l0{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:700;}
  .tree-label .code{font-family:var(--font-mono); font-size:.72rem; color:var(--ink-dim); margin-right:6px;}

  /* ---- pyramid ---- */
  .pyramid-wrap{margin:36px auto 0; max-width:520px;}
  .pyramid{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .pyr-layer{
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:16px 14px; border-radius:6px; color:#fff; font-size:.84rem; font-weight:700; font-family:var(--font-display);
  }

  /* ---- calculators ---- */
  .calc-form{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; background:var(--surface-2); border:1px solid var(--rule); border-radius:10px; padding:16px;}
  @media (max-width:700px){ .calc-form{grid-template-columns:repeat(2,1fr);} }
  .calc-form label{display:flex; flex-direction:column; gap:3px; font-size:.66rem; color:var(--ink-dim);}
  .calc-form select, .calc-form input{font-family:var(--font-mono); font-size:.88rem; background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:6px 8px; color:var(--ink); width:100%;}
  .calc-form.mini{grid-template-columns:repeat(3,1fr); padding:14px;}
  @media (max-width:560px){ .calc-form.mini{grid-template-columns:repeat(2,1fr);} }
  .calc-card{margin-bottom:16px;}
  .calc-result{display:flex; gap:18px; flex-wrap:wrap; margin-top:12px;}
  .calc-result .cr-item{background:var(--accent-soft); border-radius:8px; padding:10px 16px; flex:1; min-width:140px;}
  .calc-result .cr-label{display:block; font-size:.66rem; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px;}
  .calc-result .cr-value{font-family:var(--font-mono); font-size:1.15rem; font-weight:700; color:var(--accent);}

  .btn{background:var(--accent); color:var(--surface); border:none; border-radius:7px; padding:8px 16px; font-weight:700; font-size:.8rem; cursor:pointer; font-family:var(--font-display);}
  .btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--rule);}
  .btn.ghost:hover{border-color:var(--accent); color:var(--accent);}
  .btn.small{padding:5px 11px; font-size:.72rem;}

  /* ---- flip cards ---- */
  .flip-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  @media (max-width:700px){ .flip-grid{grid-template-columns:repeat(2,1fr);} }
  .flip-card{perspective:1000px; height:150px; cursor:pointer;}
  .flip-inner{position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d;}
  .flip-card.flipped .flip-inner{transform:rotateY(180deg);}
  .flip-face{position:absolute; inset:0; backface-visibility:hidden; border:1px solid var(--rule); border-radius:10px; padding:14px; display:flex; flex-direction:column; justify-content:center;}
  .flip-front{background:var(--surface-2);}
  .flip-front h4{font-size:.94rem; margin-top:6px; font-family:var(--font-display);}
  .flip-front .tap{margin-top:auto; font-size:.64rem; color:var(--ink-dim);}
  .flip-back{background:var(--accent-soft); transform:rotateY(180deg); font-size:.78rem; color:var(--ink); overflow:auto;}

  /* ---- document mockup ---- */
  .doc-mock{background:var(--surface); border:1px solid var(--rule); border-radius:10px; overflow:hidden; box-shadow:0 1px 0 rgba(0,0,0,.04);}
  .doc-mock .dm-head{background:var(--accent-soft); color:var(--accent); padding:12px 18px; border-bottom:2px solid var(--accent);}
  .doc-mock .dm-head .eyebrow{color:var(--accent);}
  .doc-mock .dm-head h4{font-size:1rem; margin-top:2px; font-family:var(--font-display);}
  .doc-mock .dm-body{padding:14px 18px;}
  .doc-mock table{width:100%; border-collapse:collapse; font-size:.82rem;}
  .doc-mock td{padding:5px 4px; border-bottom:1px solid var(--rule);}
  .doc-mock td.num{text-align:right; font-family:var(--font-mono);}
  .doc-mock tr.total td{font-weight:700; border-top:1px solid var(--ink-dim);}

  /* ---- risk matrix ---- */
  .riskmatrix-wrap{display:flex; gap:22px; flex-wrap:wrap; align-items:flex-start;}
  .riskmatrix{display:grid; grid-template-columns:90px repeat(5,1fr); gap:4px; flex:none; width:100%; max-width:480px;}
  .rm-head{font-size:.68rem; color:var(--ink-dim); text-align:center; font-weight:700; padding:4px 2px; font-family:var(--font-display);}
  .rm-rowlabel{font-size:.7rem; color:var(--ink-dim); display:flex; align-items:center; justify-content:flex-end; text-align:right; padding-right:6px; font-weight:700;}
  .rm-cell{
    aspect-ratio:1; border-radius:6px; border:none; cursor:pointer; color:#fff; font-family:var(--font-mono);
    font-size:.72rem; font-weight:700; display:flex; align-items:center; justify-content:center;
    transition:transform .12s, box-shadow .12s;
  }
  .rm-cell:hover{transform:scale(1.08); box-shadow:0 4px 10px rgba(0,0,0,.18); z-index:1;}
  .rm-cell.sel{outline:3px solid var(--ink); outline-offset:1px;}
  .rm-axis-x{grid-column:2/7; text-align:center; font-size:.68rem; color:var(--ink-dim); margin-top:4px; letter-spacing:.06em; text-transform:uppercase;}
  .rm-desc{flex:1; min-width:240px; background:var(--surface-2); border:1px solid var(--rule); border-radius:10px; padding:16px 18px; min-height:150px;}
  .rm-legend{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; font-size:.68rem; color:var(--ink-dim);}
  .rm-legend span{display:inline-flex; align-items:center; gap:5px;}
  .rm-legend i{width:11px; height:11px; border-radius:3px; display:inline-block;}

  .btn{background:var(--accent); color:var(--surface); border:none; border-radius:7px; padding:8px 16px; font-weight:700; font-size:.8rem; cursor:pointer; font-family:var(--font-display);}

  /* ---- exercises / quiz shared ---- */
  .ex-fb{display:block; font-size:.66rem; margin-top:2px; min-height:1em;}
  .ex-fb.ok{color:var(--good);}
  .ex-fb.bad{color:var(--bad);}
  .exercise-status{font-weight:700; font-size:.88rem; padding:10px 14px; border-radius:8px; margin-bottom:14px;}
  .exercise-status.ok{background:color-mix(in srgb, var(--good) 16%, var(--surface-2)); color:var(--good);}
  .exercise-status.warn{background:color-mix(in srgb, var(--warn) 16%, var(--surface-2)); color:var(--warn);}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute; left:0; top:0; width:100%;}
  }

  /* ---- connect-the-dots game ---- */
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);} }
  .connect-wrap{position:relative; overflow-x:auto;}
  .connect-svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1;}
  .connect-cols{display:grid; grid-template-columns:1fr 1fr; gap:48px; position:relative; z-index:2; min-width:480px;}
  .connect-col{display:flex; flex-direction:column; gap:10px;}
  .connect-card{display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--rule); border-radius:8px; padding:10px 12px; font-size:.84rem;}
  .cc-text{flex:1;}
  .cc-dot{
    width:16px; height:16px; border-radius:50%; border:2px solid var(--accent); background:var(--surface);
    flex:none; cursor:pointer; transition:background .15s, transform .15s;
  }
  .cc-dot:hover{transform:scale(1.2);}
  .cc-dot.sel{background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft);}
  .cc-dot.done{background:var(--good); border-color:var(--good); cursor:default;}
  .cc-dot.wrong{background:var(--bad); border-color:var(--bad); animation:shake .3s;}
  .connect-footer{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:14px;}
  .connect-status{font-family:var(--font-mono); font-size:.78rem; color:var(--ink-dim);}

  /* ---- reflection block ---- */
  .reflect{background:var(--surface-2); border:1px solid var(--rule); border-left:4px solid var(--accent); border-radius:0 10px 10px 0; padding:18px 20px;}
  .reflect .scenario{font-style:italic; color:var(--ink); margin-bottom:10px;}
  .reflect .question{font-weight:700; margin-bottom:12px; font-family:var(--font-display);}
  .reflect .reveal{display:none; margin-top:12px; padding-top:12px; border-top:1px dashed var(--rule); font-size:.88rem; color:var(--ink-dim);}
  .reflect.open .reveal{display:block;}

  /* ---- quiz ---- */
  .q-block{margin-bottom:18px;}
  .q-text{font-weight:700; margin-bottom:8px; font-size:.92rem; font-family:var(--font-display);}
  .q-opts{display:flex; flex-direction:column; gap:6px;}
  .q-opt{text-align:left; background:var(--surface-2); border:1px solid var(--rule); border-radius:7px; padding:8px 12px; font-size:.85rem; cursor:pointer; color:var(--ink); font-family:var(--font-body);}
  .q-opt:hover{border-color:var(--accent);}
  .q-opt.correct{border-color:var(--good); background:color-mix(in srgb, var(--good) 16%, var(--surface-2));}
  .q-opt.wrong{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, var(--surface-2));}
  .q-opt[disabled]{cursor:default;}
  .q-fb{font-size:.78rem; color:var(--ink-dim); margin-top:6px; min-height:1em;}
  .quiz-result{font-family:var(--font-mono); font-size:.82rem; padding:9px 14px; border-radius:7px; background:var(--surface-3); display:inline-block;}

  /* ---- glossary ---- */
  .gloss-search{
    width:100%; font-family:var(--font-body); font-size:.95rem; padding:10px 14px;
    border:1px solid var(--rule); border-radius:8px; background:var(--surface-2); color:var(--ink); margin-bottom:18px;
  }
  .gloss-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (max-width:700px){ .gloss-grid{grid-template-columns:1fr;} }
  .gloss-item{background:var(--surface-2); border:1px solid var(--rule); border-radius:8px; padding:10px 14px;}
  .gloss-item dt{font-weight:700; font-size:.86rem; margin-bottom:3px; font-family:var(--font-display);}
  .gloss-item dd{margin:0; font-size:.82rem; color:var(--ink-dim);}
  .gloss-empty{color:var(--ink-dim); font-size:.86rem; padding:20px 0; text-align:center;}

  /* ---- ledger table ---- */
  .table-scroll{overflow-x:auto;}
  table.ledger{width:100%; border-collapse:collapse; font-size:.84rem;}
  table.ledger td{padding:6px 8px; border-bottom:1px solid var(--rule);}
  table.ledger td.num{text-align:right; font-family:var(--font-mono);}

  /* ---- final ---- */
  .final-wrap{text-align:center; padding:20px 0 10px;}
  .final-card{
    background:linear-gradient(135deg, color-mix(in srgb, var(--cat-1) 12%, var(--surface-2)), color-mix(in srgb, var(--cat-4) 12%, var(--surface-2)));
    border:1px solid var(--rule); border-radius:14px; padding:28px 24px; margin-top:18px;
  }
  .final-score{font-family:var(--font-mono); font-size:2.4rem; color:var(--accent); font-weight:700;}
  .final-message{max-width:56ch; margin:0 auto; text-align:left;}
  .final-message p{font-size:.98rem;}
  .final-signoff{font-style:italic; margin-top:16px;}
  .final-contact{margin-top:20px; font-size:.9rem;}
  .final-contact a{color:var(--accent); font-weight:700; text-decoration:none;}
  .final-contact a:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="deck" id="deckRoot">
  <aside class="rail" id="rail">
    <div class="rail-scroll">
      <div class="rail-brand">
        <span class="eyebrow">Guia de estudos</span>
        <h1>Sustentabilidade, Saúde e Segurança no Trabalho</h1>
      </div>
      <div id="railModules"></div>
    </div>
    <div class="rail-footer">Desenvolvido por: <a href="https://www.instagram.com/prof.arijunior/" target="_blank" rel="noopener">@prof.arijunior</a></div>
  </aside>

  <div class="main">
    <div class="stage-wrap" id="stageWrap">
      <div class="stage" id="stage"></div>
    </div>
    <div class="navbar" id="navbar">
      <button class="iconbtn" id="railToggle" title="Mostrar/ocultar sumário" aria-label="Sumário">☰</button>
      <span class="crumb" id="crumb"></span>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="count" id="slideCount"></span>
      <span class="score" id="scoreBadge"></span>
      <div class="nav-arrows">
        <button class="iconbtn" id="prevBtn" title="Anterior" aria-label="Slide anterior">←</button>
        <button class="iconbtn" id="nextBtn" title="Próximo" aria-label="Próximo slide">→</button>
      </div>
    </div>
  </div>

  <div class="corner-controls">
    <button class="iconbtn" id="themeBtn" title="Tema" aria-label="Alternar tema">◐</button>
    <button class="iconbtn" id="fullscreenBtn" title="Tela cheia" aria-label="Tela cheia">⛶</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ========================================================= helpers */
  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html!==undefined) e.innerHTML = html;
    return e;
  }
  function polar(cx,cy,r,angleDeg){
    var a = angleDeg*Math.PI/180;
    return {x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)};
  }

  /* ========================================================= state */
  var STORE_KEY = "sst_qvt_deck_v1";
  var state = (function(){
    try{ var raw = localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
    return {cur:0, visited:{}, answered:{}};
  })();
  function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
  if(!state.correctSet) state.correctSet = {};

  /* ========================================================= content builders */

  function stepsList(container, steps){
    var wrap = el("div","steps");
    steps.forEach(function(s){
      var row = el("div","step");
      row.innerHTML = "<span class='sn'></span><div class='st'><h4>"+s.t+"</h4><p>"+s.d+"</p></div>";
      wrap.appendChild(row);
    });
    container.appendChild(wrap);
  }

  function bars(container, rows, maxAbs){
    var wrap = el("div","bars");
    var mx = maxAbs || Math.max.apply(null, rows.map(function(r){return Math.abs(r.value);}));
    rows.forEach(function(r){
      var pct = Math.max(2, Math.round(100*Math.abs(r.value)/mx));
      var cls = r.total ? "total" : (r.value<0 ? "neg":"pos");
      var row = el("div","bar-row"+(r.total?" total":""));
      row.innerHTML = "<span class='lbl'>"+r.label+"</span>"+
        "<span class='bar-track'><span class='bar-fill "+cls+"' style='width:"+pct+"%;'></span></span>"+
        "<span class='val mono'>"+r.value.toLocaleString("pt-BR")+(r.suffix||"")+"</span>";
      wrap.appendChild(row);
    });
    container.appendChild(wrap);
  }

  function pyramid(container, layers){
    var outer = el("div","pyramid-wrap");
    var wrap = el("div","pyramid");
    outer.appendChild(wrap);
    layers.forEach(function(l,i){
      var w = 100 - i*14;
      var d = el("div","pyr-layer", l.t);
      d.style.width = w+"%";
      d.style.background = l.c;
      wrap.appendChild(d);
    });
    container.appendChild(outer);
  }

  function seqFlow(container, steps){
    var wrap = el("div","seq-flow");
    var CAT = ["var(--cat-1)","var(--cat-2)","var(--cat-3)","var(--cat-4)","var(--cat-5)"];
    steps.forEach(function(s,i){
      var box = el("div","seq-box", s);
      box.style.borderLeftColor = CAT[i%CAT.length];
      wrap.appendChild(box);
      if(i<steps.length-1) wrap.appendChild(el("span","seq-arrow","→"));
    });
    container.appendChild(wrap);
  }

  function treeNode(container, code, label, children, level){
    var node = el("div","tree-node"+(level===0?" l0":""));
    node.appendChild(el("div","tree-label"+(level===0?" l0":""), (code?"<span class='code'>"+code+"</span>":"")+label));
    if(children){ children.forEach(function(c){ treeNode(node, c.code, c.label, c.children, level+1); }); }
    container.appendChild(node);
  }

  function flipGrid(container, items){
    var grid = el("div","flip-grid");
    items.forEach(function(s){
      var card = el("div","flip-card");
      card.innerHTML = '<div class="flip-inner">'+
        '<div class="flip-face flip-front"><span class="eyebrow">'+(s.kicker||"Sigla")+'</span><h4>'+s.t+'</h4><span class="tap">toque para ver a definição</span></div>'+
        '<div class="flip-face flip-back">'+s.d+'</div></div>';
      card.addEventListener("click", function(){ card.classList.toggle("flipped"); });
      grid.appendChild(card);
    });
    container.appendChild(grid);
  }

  function radialDiagram(container, nodes, centerLabel, opts){
    opts = opts || {};
    var CAT = ["var(--cat-1)","var(--cat-2)","var(--cat-3)","var(--cat-4)","var(--cat-5)"];
    var cx=140, cy=140, R=112;
    var iwrap = el("div","interfaces-wrap");
    var radial = el("div","radial");

    var spokesSvg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    spokesSvg.setAttribute("class","radial-spokes");
    spokesSvg.setAttribute("viewBox","0 0 280 280");
    var spokeLines = [];
    nodes.forEach(function(n){
      var pos = polar(cx,cy,R,n.angle-90);
      var line = document.createElementNS("http://www.w3.org/2000/svg","line");
      line.setAttribute("x1",cx); line.setAttribute("y1",cy);
      line.setAttribute("x2",pos.x); line.setAttribute("y2",pos.y);
      line.setAttribute("stroke","var(--rule)"); line.setAttribute("stroke-width","2");
      line.setAttribute("stroke-dasharray","3 5");
      spokesSvg.appendChild(line);
      spokeLines.push(line);
    });
    radial.appendChild(spokesSvg);
    radial.appendChild(el("div","hub",centerLabel));

    var desc = el("div","interfaces-desc","<span class='eyebrow'>Selecione uma área</span><p style='margin:0;'>Toque em um dos círculos ao redor para ver a relação.</p>");
    var progress = el("div","interfaces-progress","0 / "+nodes.length+" áreas exploradas");
    var reflectHolder = el("div","");
    var visited = {};

    nodes.forEach(function(n,i){
      var pos = polar(cx,cy,R,n.angle-90);
      var col = CAT[i%CAT.length];
      var node = el("div","node", "<span>"+n.label+"</span><span class='check' style='background:"+col+";'>✓</span>");
      node.style.top = pos.y+"px"; node.style.left = pos.x+"px";
      node.addEventListener("click", function(){
        Array.prototype.forEach.call(radial.querySelectorAll(".node"), function(x){x.classList.remove("sel");});
        node.classList.add("sel","visited");
        node.style.borderColor = col;
        spokeLines[i].setAttribute("stroke", col);
        spokeLines[i].setAttribute("stroke-dasharray","0");
        visited[i] = true;
        desc.innerHTML = "<span class='eyebrow' style='color:"+col+";'>"+n.label+"</span><p style='margin:0;'>"+n.text+"</p>";
        var nv = Object.keys(visited).length;
        progress.textContent = nv+" / "+nodes.length+" áreas exploradas";
        if(opts.completionText && nv===nodes.length && !reflectHolder.getAttribute("data-shown")){
          reflectHolder.setAttribute("data-shown","1");
          reflectHolder.innerHTML = "<div class='reflect' style='margin-top:18px;'><span class='eyebrow'>Ciclo completo — para refletir</span><p class='question' style='margin-top:8px;'>"+opts.completionText+"</p></div>";
        }
      });
      radial.appendChild(node);
    });

    iwrap.appendChild(radial);
    var descCol = el("div","");
    descCol.appendChild(desc); descCol.appendChild(progress);
    iwrap.appendChild(descCol);
    container.appendChild(iwrap);
    container.appendChild(reflectHolder);
  }

  function docMock(container, kicker, title, rows, foot){
    var wrap = el("div","doc-mock");
    var head = el("div","dm-head","<span class='eyebrow'>"+kicker+"</span><h4>"+title+"</h4>");
    wrap.appendChild(head);
    var body = el("div","dm-body");
    var table = document.createElement("table");
    var html = "";
    rows.forEach(function(r){
      html += "<tr"+(r.total?" class='total'":"")+"><td>"+r.label+"</td><td class='num'>"+r.value+"</td></tr>";
    });
    table.innerHTML = html;
    body.appendChild(table);
    if(foot){ body.appendChild(el("p","note", foot)); }
    wrap.appendChild(body);
    container.appendChild(wrap);
  }

  /* ---- interactive risk matrix (probabilidade x severidade) ---- */
  function riskMatrix(container, opts){
    var PROB = ["Rara","Improvável","Possível","Provável","Quase certa"];
    var SEV = ["Catastrófica","Grave","Moderada","Leve"]; // top row = mais grave
    var wrap = el("div","riskmatrix-wrap");
    var gridOuter = el("div","");
    var grid = el("div","riskmatrix");
    gridOuter.appendChild(grid);
    gridOuter.appendChild(el("div","rm-axis-x","Probabilidade de ocorrência →"));
    var desc = el("div","rm-desc","<span class='eyebrow'>Selecione uma célula</span><p style='margin-top:6px;'>Toque em qualquer cruzamento de probabilidade × severidade para ver um risco real de exemplo e a resposta esperada da empresa.</p>");

    grid.appendChild(el("div","rm-head",""));
    PROB.forEach(function(p){ grid.appendChild(el("div","rm-head", p)); });

    function colorFor(score){
      if(score>=16) return "var(--bad)";
      if(score>=10) return "var(--warn)";
      if(score>=5) return "color-mix(in srgb, var(--warn) 55%, var(--good))";
      return "var(--good)";
    }

    SEV.forEach(function(sevLabel, si){
      grid.appendChild(el("div","rm-rowlabel", sevLabel));
      PROB.forEach(function(probLabel, pi){
        var sevWeight = SEV.length - si; // catastrófica=4 ... leve=1
        var probWeight = pi+1; // rara=1 ... quase certa=5
        var score = sevWeight*probWeight;
        var cell = el("button","rm-cell", score);
        cell.type = "button";
        cell.style.background = colorFor(score);
        cell.title = sevLabel+" × "+probLabel;
        cell.addEventListener("click", function(){
          Array.prototype.forEach.call(grid.querySelectorAll(".rm-cell"), function(c){ c.classList.remove("sel"); });
          cell.classList.add("sel");
          var example = (opts.examples && opts.examples[si+"_"+pi]) ||
            {risco:"Combinação "+sevLabel.toLowerCase()+" × "+probLabel.toLowerCase()+".", resposta:"Quanto mais alto o cruzamento, maior a prioridade de ação imediata e de investimento em controles coletivos."};
          desc.innerHTML = "<span class='eyebrow'>"+sevLabel+" × "+probLabel+" — pontuação "+score+"</span>"+
            "<p style='margin-top:6px;'><strong>Exemplo de risco:</strong> "+example.risco+"</p>"+
            "<p style='margin-bottom:0;'><strong>Resposta esperada:</strong> "+example.resposta+"</p>";
        });
        grid.appendChild(cell);
      });
    });

    var legend = el("div","rm-legend",
      "<span><i style='background:var(--good);'></i>Risco baixo — monitorar</span>"+
      "<span><i style='background:color-mix(in srgb, var(--warn) 55%, var(--good));'></i>Moderado — planejar ação</span>"+
      "<span><i style='background:var(--warn);'></i>Alto — agir em prazo definido</span>"+
      "<span><i style='background:var(--bad);'></i>Crítico — ação imediata</span>");
    gridOuter.appendChild(legend);

    wrap.appendChild(gridOuter);
    wrap.appendChild(desc);
    container.appendChild(wrap);
  }

  function sampleFromBank(bank, n){
    var pool = bank.map(function(p){return p;});
    for(var i=pool.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = pool[i]; pool[i]=pool[j]; pool[j]=t;
    }
    return pool.slice(0,n);
  }

  function connectGame(container, bank, n){
    var wrap = el("div","connect-wrap");
    var svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("class","connect-svg");
    var inner = el("div","connect-cols");
    var colL = el("div","connect-col");
    var colR = el("div","connect-col");
    inner.appendChild(colL); inner.appendChild(colR);
    wrap.appendChild(svg); wrap.appendChild(inner);
    container.appendChild(wrap);

    var footer = el("div","connect-footer");
    var status = el("div","connect-status","");
    var reloadBtn = el("button","btn ghost small","🔀 Carregar novas situações");
    reloadBtn.type="button";
    footer.appendChild(status); footer.appendChild(reloadBtn);
    container.appendChild(footer);

    var selected = null, solvedCount = 0, pairs = [];

    function dotCenter(dot){
      var dr = dot.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
      return {x: dr.left+dr.width/2-wr.left, y: dr.top+dr.height/2-wr.top};
    }
    function drawLine(leftDot, rightDot){
      var a = dotCenter(leftDot), b = dotCenter(rightDot);
      var line = document.createElementNS("http://www.w3.org/2000/svg","line");
      line.setAttribute("x1",a.x); line.setAttribute("y1",a.y);
      line.setAttribute("x2",b.x); line.setAttribute("y2",b.y);
      line.setAttribute("stroke","var(--good)"); line.setAttribute("stroke-width","2.5"); line.setAttribute("stroke-linecap","round");
      line.setAttribute("data-l", leftDot.getAttribute("data-id"));
      svg.appendChild(line);
    }
    function redrawLines(){
      Array.prototype.forEach.call(svg.querySelectorAll("line"), function(line){
        var id = line.getAttribute("data-l");
        var leftDot = colL.querySelector(".cc-dot[data-id='"+id+"']");
        var rightDot = colR.querySelector(".cc-dot[data-id='"+id+"']");
        if(!leftDot||!rightDot) return;
        var a = dotCenter(leftDot), b = dotCenter(rightDot);
        line.setAttribute("x1",a.x); line.setAttribute("y1",a.y);
        line.setAttribute("x2",b.x); line.setAttribute("y2",b.y);
      });
    }
    window.addEventListener("resize", function(){ if(document.body.contains(wrap)) redrawLines(); });

    function onDotClick(dot){
      if(dot.classList.contains("done")) return;
      var side = dot.getAttribute("data-side");
      if(!selected){
        if(side==="l"){ selected = dot; dot.classList.add("sel"); }
        return;
      }
      if(selected===dot) return;
      var selSide = selected.getAttribute("data-side");
      if(selSide===side){
        selected.classList.remove("sel");
        selected = (side==="l") ? dot : null;
        if(selected) selected.classList.add("sel");
        return;
      }
      var leftDot = selSide==="l" ? selected : dot;
      var rightDot = selSide==="l" ? dot : selected;
      if(leftDot.getAttribute("data-id")===rightDot.getAttribute("data-id")){
        leftDot.classList.remove("sel"); leftDot.classList.add("done");
        rightDot.classList.add("done");
        drawLine(leftDot, rightDot);
        solvedCount++;
        status.textContent = solvedCount+" / "+n+" conectados"+(solvedCount===n?" — concluído!":"");
        selected = null;
      } else {
        dot.classList.add("wrong");
        setTimeout(function(){ dot.classList.remove("wrong"); }, 300);
        selected.classList.remove("sel");
        selected = null;
      }
    }

    function build(){
      pairs = sampleFromBank(bank, n);
      var shuffledRight = pairs.map(function(p){return p;}).sort(function(){return Math.random()-0.5;});
      colL.innerHTML = ""; colR.innerHTML = ""; svg.innerHTML = "";
      selected = null; solvedCount = 0;
      status.textContent = "0 / "+n+" conectados";
      pairs.forEach(function(p){
        var card = el("div","connect-card left", "<span class='cc-text'>"+p.lanc+"</span><span class='cc-dot' data-side='l' data-id='"+p.id+"'></span>");
        colL.appendChild(card);
      });
      shuffledRight.forEach(function(p){
        var card = el("div","connect-card right", "<span class='cc-dot' data-side='r' data-id='"+p.id+"'></span><span class='cc-text'>"+p.conta+"</span>");
        colR.appendChild(card);
      });
      Array.prototype.forEach.call(wrap.querySelectorAll(".cc-dot"), function(dot){
        dot.addEventListener("click", function(){ onDotClick(dot); });
      });
    }
    reloadBtn.addEventListener("click", build);
    build();
  }

  function calcResult(container, items){
    var wrap = el("div","calc-result");
    items.forEach(function(it){
      wrap.appendChild(el("div","cr-item","<span class='cr-label'>"+it.label+"</span><span class='cr-value mono'>"+it.value+"</span>"));
    });
    container.innerHTML = "";
    container.appendChild(wrap);
  }

  function calcCard(container, title, fieldDefs, computeFn){
    var card = el("div","card calc-card");
    card.appendChild(el("h4","", title));
    var form = el("div","calc-form mini");
    fieldDefs.forEach(function(f){
      var lab = el("label","", f.label);
      var inp;
      if(f.type==="select"){
        inp = document.createElement("select");
        f.options.forEach(function(o){
          var opt = document.createElement("option");
          opt.value = o.v; opt.textContent = o.label;
          inp.appendChild(opt);
        });
        inp.value = f.v;
      } else {
        inp = document.createElement("input");
        inp.type="number"; inp.value=f.v;
      }
      inp.className="mini-input"; inp.setAttribute("data-k", f.k);
      inp.addEventListener("input", recompute);
      inp.addEventListener("change", recompute);
      lab.appendChild(inp);
      form.appendChild(lab);
    });
    card.appendChild(form);
    var resultBox = el("div","");
    card.appendChild(resultBox);
    function recompute(){
      var v = {};
      Array.prototype.forEach.call(form.querySelectorAll(".mini-input"), function(inp){
        var raw = inp.tagName==="SELECT" ? inp.value : parseFloat(inp.value);
        v[inp.getAttribute("data-k")] = (typeof raw==="number" && isNaN(raw)) ? 0 : raw;
      });
      calcResult(resultBox, computeFn(v));
    }
    recompute();
    container.appendChild(card);
  }

  function quizBlock(container, moduleId, questions){
    var resultEl = el("div","quiz-result","0 / "+questions.length+" corretas");
    questions.forEach(function(q, qi){
      var qid = moduleId+"_"+qi;
      var block = el("div","q-block");
      block.appendChild(el("div","q-text", (qi+1)+". "+q.q));
      var opts = el("div","q-opts");
      var fb = el("div","q-fb");
      q.opts.forEach(function(optText, oi){
        var b = el("button","q-opt", optText);
        b.type="button";
        if(state.answered[qid]!==undefined){
          b.disabled = true;
          if(oi===q.a) b.classList.add("correct");
          if(oi===state.answered[qid] && oi!==q.a) b.classList.add("wrong");
        }
        b.addEventListener("click", function(){
          if(state.answered[qid]!==undefined) return;
          state.answered[qid]=oi;
          if(!state.correctSet) state.correctSet = {};
          if(oi===q.a) state.correctSet[qid]=true;
          save();
          Array.prototype.forEach.call(opts.children, function(x,xi){ x.disabled=true; if(xi===q.a) x.classList.add("correct"); });
          if(oi===q.a){ b.classList.add("correct"); fb.textContent="Correto."; }
          else { b.classList.add("wrong"); fb.textContent="Resposta correta destacada."; }
          updateResult(); updateScoreBadge();
        });
        opts.appendChild(b);
      });
      block.appendChild(opts); block.appendChild(fb);
      container.appendChild(block);
    });
    function updateResult(){
      var c=0;
      questions.forEach(function(q,qi){ var qid=moduleId+"_"+qi; if(state.answered[qid]===q.a) c++; });
      resultEl.textContent = c+" / "+questions.length+" corretas";
    }
    updateResult();
    container.appendChild(resultEl);
  }

  var GLOSSARY = [
    {t:"Sustentabilidade", d:"Capacidade de atender às necessidades do presente sem comprometer a capacidade das gerações futuras de atender às suas próprias necessidades (Relatório Brundtland, 1987)."},
    {t:"Responsabilidade socioambiental (RSE)", d:"Compromisso voluntário da empresa em agir de forma ética em relação à sociedade e ao meio ambiente, indo além das exigências legais."},
    {t:"Tripé da sustentabilidade (Triple Bottom Line)", d:"Modelo de Elkington (1994) que avalia a empresa em três dimensões: ambiental (Planeta), social (Pessoas) e econômica (Lucro)."},
    {t:"ESG", d:"Sigla em inglês para Environmental, Social and Governance — critérios ambientais, sociais e de governança usados para avaliar a sustentabilidade de uma organização."},
    {t:"ODS", d:"Objetivos de Desenvolvimento Sustentável — os 17 objetivos globais da ONU (Agenda 2030) que orientam metas de sustentabilidade corporativa."},
    {t:"Promoção da saúde", d:"Conforme a Carta de Ottawa (OMS, 1986), processo de capacitar as pessoas a aumentar o controle sobre sua saúde e a melhorá-la, agindo sobre determinantes amplos — não apenas sobre doenças específicas."},
    {t:"Prevenção de doenças", d:"Ações focadas em reduzir fatores de risco de doenças específicas — complementar, mas distinto, da promoção da saúde, que é mais ampla."},
    {t:"Qualidade de Vida no Trabalho (QVT)", d:"Conjunto de ações de uma empresa que envolvem a implantação de melhorias e inovações gerenciais, tecnológicas e estruturais no ambiente de trabalho, visando o bem-estar dos colaboradores."},
    {t:"Modelo de Walton", d:"Modelo de 1973 que avalia a QVT em oito categorias, como compensação justa, condições de segurança, uso e desenvolvimento de capacidades e relevância social do trabalho."},
    {t:"Endomarketing", d:"Marketing interno (Saul Bekin, 1995) — conjunto de ações de comunicação e engajamento voltadas ao público interno (colaboradores), para alinhar cultura e fortalecer o comprometimento antes de comunicar para fora."},
    {t:"Clima organizacional", d:"Percepção coletiva dos colaboradores sobre o ambiente de trabalho, políticas e relações internas, frequentemente medida por pesquisas internas."},
    {t:"CLT", d:"Consolidação das Leis do Trabalho — principal norma trabalhista brasileira, cujo Capítulo V trata de Segurança e Medicina do Trabalho."},
    {t:"Norma Regulamentadora (NR)", d:"Normas emitidas pelo Ministério do Trabalho e Emprego que detalham obrigações de segurança e saúde no trabalho previstas na CLT."},
    {t:"PGR", d:"Programa de Gerenciamento de Riscos (NR-1) — documento que substituiu o PPRA, reunindo o Inventário de Riscos e o Plano de Ação da empresa."},
    {t:"PCMSO", d:"Programa de Controle Médico de Saúde Ocupacional (NR-7) — define exames médicos obrigatórios (admissional, periódico, de retorno, de mudança de função e demissional)."},
    {t:"ASO", d:"Atestado de Saúde Ocupacional — documento emitido após os exames do PCMSO, que declara o trabalhador apto ou inapto para a função."},
    {t:"Ergonomia (NR-17)", d:"Norma que trata da adaptação das condições de trabalho às características do trabalhador, reduzindo esforços e riscos posturais."},
    {t:"Trabalho em altura (NR-35)", d:"Norma aplicável a todo trabalho executado acima de 2 metros do nível inferior, com risco de queda."},
    {t:"Segurança em eletricidade (NR-10)", d:"Norma que estabelece requisitos para garantir a segurança em instalações e serviços com eletricidade."},
    {t:"Sinalização de segurança (NR-26)", d:"Norma que define cores e sinalizações para identificar e alertar sobre riscos nos ambientes de trabalho."},
    {t:"EPI", d:"Equipamento de Proteção Individual (NR-6) — dispositivo de uso individual destinado a proteger o trabalhador contra riscos à sua saúde ou segurança."},
    {t:"EPC", d:"Equipamento de Proteção Coletiva — medida que protege todos os trabalhadores expostos a um risco (ex.: guarda-corpo, exaustão, enclausuramento), com prioridade sobre o EPI na hierarquia de controle."},
    {t:"Hierarquia de controle de riscos", d:"Ordem de prioridade das medidas de segurança: eliminar o risco, substituí-lo, controlá-lo coletivamente (EPC), depois administrativamente, e só por último proteger individualmente (EPI)."},
    {t:"Risco ocupacional", d:"Probabilidade de um trabalhador sofrer dano à saúde em razão da exposição a um agente ou condição presente no ambiente ou na organização do trabalho."},
    {t:"Mapa de risco", d:"Representação gráfica de um conjunto de fatores de risco presentes nos locais de trabalho, elaborado pela CIPA, usando cores padronizadas por tipo de risco."},
    {t:"APR", d:"Análise Preliminar de Risco — método que identifica, antes do início de uma atividade, os perigos envolvidos e as medidas de controle necessárias."},
    {t:"SESMT", d:"Serviço Especializado em Engenharia de Segurança e em Medicina do Trabalho (NR-4) — equipe técnica interna responsável por antecipar, reconhecer, avaliar e controlar riscos ocupacionais."},
    {t:"CIPA", d:"Comissão Interna de Prevenção de Acidentes e Assédio (NR-5) — comissão paritária de empregados e empregador voltada à prevenção de acidentes e doenças no trabalho."},

    }

    renderList("");
  }

      "<span class='eyebrow'>Jornada concluída</span>"+
      "<h2 style='margin-top:10px;'>Você percorreu todo o guia</h2>"+
      "<div class='final-score' id='finalScore'>—</div>"+
      "<div class='final-message'>"+
      "<p>Da sustentabilidade e responsabilidade socioambiental até a Comunicação de Acidente de Trabalho, você passou por conceitos, normas e ferramentas que sustentam a gestão de pessoas e a segurança no ambiente corporativo: RSE, promoção da saúde, QVT, endomarketing, legislação de SST, riscos ocupacionais, SESMT, CIPA e CAT.</p>"+
      "<p>Esses temas se conectam: uma empresa que cuida da segurança física também constrói qualidade de vida; uma que comunica bem internamente (endomarketing) sustenta melhor seus programas de saúde e seus projetos socioambientais. Nenhum desses temas funciona isolado dos demais.</p>"+
      "</div>"+
      "<p class='final-signoff'>Bons estudos — e que esse conteúdo ajude você a enxergar a segurança e a qualidade de vida no trabalho não como obrigação burocrática, mas como parte central de uma boa gestão.<br><strong>Ari Ferreira Júnior</strong></p>"+
      "<p class='final-contact'>Ficou com alguma dúvida ou sugestão sobre o conteúdo? Fala comigo: <a href='https://www.instagram.com/prof.arijunior/' target='_blank' rel='noopener'>@prof.arijunior</a></p>";
    wrap.appendChild(card);
    c.appendChild(wrap);
    var b = el("div","block"); b.style.marginTop="18px";
    b.innerHTML = "<p>Use o sumário à esquerda para voltar a qualquer tela sempre que precisar revisar — seu progresso e respostas ficam salvos neste navegador.</p>";
    c.appendChild(b);
    var btn = el("button","btn ghost small","Reiniciar progresso salvo");
    btn.addEventListener("click", function(){
      if(confirm("Isso vai apagar as respostas salvas dos quizzes. Continuar?")){
        localStorage.removeItem(STORE_KEY);
        state = {cur:0, visited:{}, answered:{}};
        goTo(0);
      }
    });
    c.appendChild(btn);
    var total = 0, correct = 0;
    Object.keys(state.answered).forEach(function(k){ total++; });
    correct = Object.keys(state.correctSet||{}).length;
    var fs = card.querySelector("#finalScore");
    if(fs) fs.textContent = total>0 ? (correct+"/"+total+" acertos nos quizzes") : "Quizzes ainda não respondidos";
  });

  /* ========================================================= RENDER ENGINE */

  var railModulesEl, stageEl, crumbEl, countEl, progressFillEl, scoreBadgeEl, prevBtn, nextBtn;
  var modToIndices = {};
  SLIDES.forEach(function(s,i){ (modToIndices[s.mod]=modToIndices[s.mod]||[]).push(i); });

  function collapseAllRailMods(exceptId){
    Array.prototype.forEach.call(railModulesEl.querySelectorAll(".rail-mod"), function(mw){
      var open = exceptId!==null && mw.getAttribute("data-mod")===exceptId;
      var sw = mw.querySelector(".rail-slides");
      var num = mw.querySelector(".rail-mod-head .num");
      mw.classList.toggle("collapsed", !open);
      sw.style.display = open ? "" : "none";
      num.textContent = open ? "▾" : "▸";
    });
  }

  function updateScoreBadge(){
    var total = Object.keys(state.answered).length;
    var correct = Object.keys(state.correctSet||{}).length;
    scoreBadgeEl.textContent = total>0 ? ("Acertos: "+correct+"/"+total) : "";
  }

  function render(){
    var idx = state.cur;
    var s = SLIDES[idx];
    stageEl.innerHTML = "";
    var slideDiv = el("div","slide");
    s.build(slideDiv);
    stageEl.appendChild(slideDiv);
    document.getElementById("stageWrap").scrollTop = 0;

    state.visited[idx] = true; save();

    crumbEl.innerHTML = "<strong>"+MODULES.find(function(m){return m.id===s.mod;}).name+"</strong> — "+s.title;
    countEl.textContent = (idx+1)+" / "+SLIDES.length;
    progressFillEl.style.width = (100*Object.keys(state.visited).length/SLIDES.length)+"%";
    updateScoreBadge();

    Array.prototype.forEach.call(railModulesEl.querySelectorAll(".rail-item"), function(it){
      var i = parseInt(it.getAttribute("data-idx"),10);
      it.classList.toggle("current", i===idx);
      it.classList.toggle("visited", !!state.visited[i]);
    });

    prevBtn.disabled = idx===0;
    nextBtn.disabled = idx===SLIDES.length-1;
    prevBtn.title = idx>0 ? "Anterior: "+SLIDES[idx-1].title : "Anterior";
    nextBtn.title = idx<SLIDES.length-1 ? "Próximo: "+SLIDES[idx+1].title : "Próximo";
  }

  function goTo(i){
    if(i<0||i>=SLIDES.length) return;
    state.cur = i; save();
    render();
    collapseAllRailMods(SLIDES[i].mod);
    if(window.innerWidth<=860) document.getElementById("rail").classList.remove("open");
  }

  document.addEventListener("DOMContentLoaded", init);
  if(document.readyState!=="loading") init();

  function init(){
    railModulesEl = document.getElementById("railModules");
    stageEl = document.getElementById("stage");
    crumbEl = document.getElementById("crumb");
    countEl = document.getElementById("slideCount");
    progressFillEl = document.getElementById("progressFill");
    scoreBadgeEl = document.getElementById("scoreBadge");
    prevBtn = document.getElementById("prevBtn");
    nextBtn = document.getElementById("nextBtn");

    MODULES.forEach(function(m){
      if(m.id==="inicio"){
        var i0 = modToIndices[m.id][0];
        var soloItem = el("button","rail-item", "<span class='dot'></span><span>"+m.name+"</span>");
        soloItem.style.fontWeight = "700";
        soloItem.setAttribute("data-idx", i0);
        soloItem.addEventListener("click", function(){ goTo(i0); });
        railModulesEl.appendChild(soloItem);
        return;
      }
      var modWrap = el("div","rail-mod collapsed");
      modWrap.setAttribute("data-mod", m.id);
      var head = el("div","rail-mod-head", "<span class='num'>▸</span><span>"+m.name+"</span>");
      var slidesWrap = el("div","rail-slides");
      slidesWrap.style.display = "none";
      head.addEventListener("click", function(){
        if(modWrap.classList.contains("collapsed")) collapseAllRailMods(m.id);
        else collapseAllRailMods(null);
      });
      modWrap.appendChild(head);
      (modToIndices[m.id]||[]).forEach(function(i){
        var item = el("button","rail-item", "<span class='dot'></span><span>"+SLIDES[i].title+"</span>");
        item.addEventListener("click", function(){ goTo(i); });
        item.setAttribute("data-idx", i);
        slidesWrap.appendChild(item);
      });
      modWrap.appendChild(slidesWrap);
      railModulesEl.appendChild(modWrap);
    });

    prevBtn.addEventListener("click", function(){ goTo(state.cur-1); });
    nextBtn.addEventListener("click", function(){ goTo(state.cur+1); });

    document.addEventListener("keydown", function(e){
      if(e.target && (e.target.tagName==="INPUT" || e.target.tagName==="TEXTAREA" || e.target.tagName==="SELECT")) return;
      if(e.key==="ArrowRight" || e.key===" "){ e.preventDefault(); goTo(state.cur+1); }
      else if(e.key==="ArrowLeft"){ e.preventDefault(); goTo(state.cur-1); }
      else if(e.key==="Escape"){ exitImmersive(); }
    });

    document.getElementById("railToggle").addEventListener("click", function(){
      document.getElementById("rail").classList.toggle("open");
    });

    var deckRoot = document.getElementById("deckRoot");
    function exitImmersive(){
      deckRoot.classList.remove("immersive");
      if(document.fullscreenElement){ try{ document.exitFullscreen(); }catch(e){} }
    }
    function enterImmersive(){
      deckRoot.classList.add("immersive");
      var p = deckRoot.requestFullscreen ? deckRoot.requestFullscreen() : null;
      if(p && p.catch) p.catch(function(){});
    }
    document.getElementById("fullscreenBtn").addEventListener("click", function(){
      if(deckRoot.classList.contains("immersive")) exitImmersive(); else enterImmersive();
    });
    document.addEventListener("fullscreenchange", function(){
      if(!document.fullscreenElement) deckRoot.classList.remove("immersive");
    });

    var THEME_KEY = "sst_qvt_theme";
    var themeBtn = document.getElementById("themeBtn");
    var themePref = "auto";
    try{ themePref = localStorage.getItem(THEME_KEY) || "auto"; }catch(e){}
    function applyTheme(pref){
      if(pref==="light" || pref==="dark") document.documentElement.setAttribute("data-theme", pref);
      else document.documentElement.removeAttribute("data-theme");
      var icon = pref==="light" ? "☀" : (pref==="dark" ? "🌙" : "◐");
      var label = pref==="light" ? "claro" : (pref==="dark" ? "escuro" : "automático (sistema)");
      themeBtn.textContent = icon;
      themeBtn.title = "Tema: "+label+" — toque para alternar";
    }
    applyTheme(themePref);
    themeBtn.addEventListener("click", function(){
      themePref = themePref==="auto" ? "light" : (themePref==="light" ? "dark" : "auto");
      try{ localStorage.setItem(THEME_KEY, themePref); }catch(e){}
      applyTheme(themePref);
    });

    if(state.cur>=SLIDES.length) state.cur = 0;
    render();
  }
})();
</script>
</body>
</html>
